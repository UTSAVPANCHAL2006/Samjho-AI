[project]
name = "samjho-backend"
version = "0.1.0"
description = "Samjho: maths mistake checker and voice tutor for CBSE Class 6-10"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "langgraph>=1.2.14",
    "lark>=1.3.1",
    "pillow>=12.3.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2",
    "sympy>=1.14.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_functions = ["test*"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
# Function and variable names are camelCase by project decision.
# B008: FastAPI uses Depends()/File() in defaults by design.
# E501: `ruff format` wraps code at 120; only long message strings remain, which stay readable as one line.
ignore = ["N802", "N803", "N806", "N815", "N816", "B008", "E501"]


[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
